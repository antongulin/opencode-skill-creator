name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      # Tests run against the committed dist, so a stale or hand-edited
      # artifact is caught before the rebuild below.
      - name: Run node tests
        run: npm test

      - name: Run Bun tests
        run: npm run test:ts

      - name: Build from source
        run: npm run build

      - name: Verify the packed artifact is publishable
        run: npm pack --dry-run --json --ignore-scripts > /dev/null
